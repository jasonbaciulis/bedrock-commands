name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Consumers resolve the newest Statamic release on every install, so a weekly
  # run catches a breaking upstream change before a project does.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none
          ini-values: zend.assertions=1

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --no-progress --no-interaction --prefer-dist

      - name: Create cache directories
        run: mkdir -p /tmp/rector /tmp/phpstan

      - name: Cache Rector
        uses: actions/cache@v6
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Cache PHPStan
        uses: actions/cache@v6
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ github.sha }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Run linters
        run: composer test:lint

      - name: Run type coverage
        run: composer test:type-coverage

      - name: Run PHPStan
        run: composer test:types

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
          ini-values: zend.assertions=1

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --no-progress --no-interaction --prefer-dist

      - name: Run tests
        run: composer test:unit
